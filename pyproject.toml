[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swingbot"
version = "0.1.0"
description = "Broker-independent weekly swing trading research and signal system with news-assisted prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.26",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
gbdt = ["lightgbm>=4.0"]
sql = ["duckdb>=0.10"]
yahoo = ["yfinance>=0.2.40"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
finbert = ["transformers>=4.40", "torch>=2.2"]
# The local dashboard. Optional so a CLI-only install pulls in no web stack; `swingbot.web`
# imports fastapi lazily, and tests/test_architecture.py asserts the package still imports
# cleanly without it.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
all = [
    "lightgbm>=4.0",
    "duckdb>=0.10",
    "yfinance>=0.2.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
swingbot = "swingbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swingbot"]
# The dashboard's Jinja2 template and its CSS/JS are loaded from the installed package at
# runtime, so they have to be in the wheel rather than only in the source tree.
artifacts = ["src/swingbot/web/templates/*", "src/swingbot/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow",
    "network: marks tests that require network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
